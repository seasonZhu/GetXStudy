name: CI

on:
  push:
    branches: [main, develop, optimize-project]
  pull_request:
    branches: [main, develop, optimize-project]

permissions:
  contents: read

jobs:
  flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check changed Dart formatting
        run: python3 .github/scripts/check_dart_format.py

      - name: Test formatting scope
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
