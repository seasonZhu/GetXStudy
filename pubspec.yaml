name: getx_study
description: A GetX Study Flutter project.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=2.17.6 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  get: ^4.6.5
  dio: ^5.2.0+1
  pretty_dio_logger: ^1.3.1
  native_dio_adapter: ^1.0.0+1
  cached_network_image: ^3.2.3
  shared_preferences: ^2.1.1
  flutter_easyloading: ^3.0.5
  pull_to_refresh: ^2.0.0
  card_swiper: ^3.0.1
  webview_flutter: ^4.2.2
  webview_flutter_jsbridge:
    git:
      url: 'https://github.com/seasonZhu/webview_flutter_jsbridge'
  flutter_slidable: ^4.0.3
  lpinyin: ^2.0.3
  marqueer: ^2.3.1
  share_plus: ^12.0.1
  rxdart: ^0.28.0
  image_picker: ^1.0.1
  url_launcher: ^6.1.5
  path_provider: ^2.0.11
  event_bus: ^2.0.0
  open_file: ^3.2.1
  visibility_detector: ^0.4.0+2
  permission_handler: ^12.0.1
  logger: ^2.6.2
  device_info_plus: ^12.3.0
  retrofit: '>=4.0.0 <5.0.0'
  json_annotation: ^4.8.1
  package_info_plus: ^8.3.0
  flutter_native_splash: ^2.4.7

# flutter_native_splash 配置说明:
# 运行生成命令: flutter pub run flutter_native_splash:create
# 清除生成: flutter pub run flutter_native_splash:remove
#
# 当前 splash 配置:
# - 原图: assets/images/launchImage.png (1242x2208, 9:16 比例)
# - 显示模式: center (保持原始比例, 居中显示)
# - 背景色: #FFFFFF (白色)
# - Android 12+: 使用固定尺寸显示
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.1
  build_runner: '>=2.3.0 <4.0.0'
  json_serializable: ^6.6.2
  dependency_validator: ^5.0.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/ic_eye.png
    - assets/images/ic_head.jpeg
    - assets/images/launchImage.png
    - assets/images/placeholder.png
    - assets/images/saber.jpg
    - assets/images/saber_logo.jpg
    - assets/images/season_ali_pay.jpg
    - assets/images/upgrade.png
    - assets/images/welcome_1.png
    - assets/images/welcome_2.jpg
    - assets/html/index.html
flr:
  core_version: 3.1.0
  dartfmt_line_length: 80
  assets: []
  fonts: []
