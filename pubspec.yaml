name: getx_study
description: A GetX Study Flutter project.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 核心框架
  get: ^4.6.6

  # 网络请求
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^3.5.0

  # 本地存储
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # UI 组件
  cached_network_image: ^3.4.1
  flutter_easyloading: ^3.0.5
  pull_to_refresh: ^2.0.0
  card_swiper: ^3.0.1
  webview_flutter: ^4.10.0
  flutter_slidable: ^3.1.1
  marqueer: ^2.2.1

  # 业务相关
  share_plus: ^12.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.3.1
  lpinyin: ^2.0.3

  # 工具
  logger: ^2.5.0
  event_bus: ^2.0.0
  rxdart: ^0.28.0

  # 网络适配器
  native_dio_adapter: ^1.5.1

  # 代码生成相关
  retrofit: ^4.2.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.14
  retrofit_generator: ^10.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/html/
    - assets/config/
